<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Concept Warriors LMS</title><link rel="stylesheet" href="style.css"></head><body>
<section id="login"><div class="card lg"><h1>⚔️ Concept Warriors</h1><p class="mut">Student Learning Portal · Login with the ID & password given at enrollment</p>
<form id="lf"><input id="id" placeholder="Student ID (e.g. CW2601)" required><input id="pw" type="password" placeholder="Password" required><button>Login</button></form>
<a href="#" id="fgl">Forgot password?</a>
<form id="fg" hidden><input id="fid" placeholder="Your Student ID"><button type="button" id="gc">Request reset code</button><input id="fc" placeholder="6-digit code from your tutor"><input id="fp" type="password" placeholder="New password (min 6 chars)"><button>Reset password</button></form></div></section>
<div id="app" hidden><aside><h2>⚔️ CW LMS</h2><nav id="nav"></nav><button id="out">Logout</button></aside><main id="main"></main></div>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
